<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d71920">
  <title>Offline - DENSO LMS</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f7f8fa; color: #202124; font: 16px/1.6 Arial, sans-serif; }
    main { width: min(100%, 440px); padding: 32px 26px; border: 1px solid #e5e7eb; border-radius: 22px; background: #fff; box-shadow: 0 16px 48px rgb(20 25 35 / 12%); text-align: center; }
    img { width: 78px; height: 78px; margin-bottom: 12px; }
    h1 { margin: 0; font-size: 23px; line-height: 1.3; }
    p { margin: 12px 0 22px; color: #626976; }
    a { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; padding: 10px 18px; border-radius: 12px; background: #d71920; color: #fff; font-weight: 700; text-decoration: none; }
    @media (prefers-color-scheme: dark) { body { background: #14171b; color: #f4f5f7; } main { border-color: #353a43; background: #20242b; } p { color: #c0c5ce; } }
  </style>
</head>

  <main>
    <img src="/assets/img/icon/dls-student-pwa-192.png" alt="">
    <h1>Anda sedang offline</h1>
    <p>Halaman ini perlu koneksi internet. Periksa jaringan Anda lalu coba buka kembali DENSO LMS.</p>
    <a href="/?route=%2Fstudent">Coba lagi</a>
  </main>

</html>
